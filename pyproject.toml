[project]
name = "po-agent"
version = "0.1.0"
description = "Agente PO: pipeline de PLN para generar backlog trazable desde transcripciones"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "boto3>=1.35",
    "google-genai>=2.19.0",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "clerk-backend-api>=7.0.0",
    "mangum>=0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "moto[dynamodb,s3,sqs]>=5.0",
    "mangum>=0.19",
    "boto3-stubs[dynamodb,s3,sqs,ssm]>=1.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services"]
# Artefactos de build: dependencias de terceros copiadas para la capa Lambda.
extend-exclude = ["infra/build", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["services"]
exclude = ["^infra/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
